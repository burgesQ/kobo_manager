[project]
name = "vault"
version = "0.1.0"
description = "Snapshot, verify, restore and export reading stats from a Kobo"
requires-python = ">=3.12"
dependencies = ["kobocore", "shtab>=1.7"]

[project.scripts]
vault = "vault.main:run"

[tool.uv.sources]
kobocore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault"]
